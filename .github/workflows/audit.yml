name: Product audit

on:
  # Started by hand or daily by Supabase (sql/002-ai-jobs-daily-start-and-exports.sql); GitHub's own
  # schedule runs late or not at all.
  workflow_dispatch:
    inputs:
      until_done:
        description: Bitene kadar devam et (her çalışma bitince bir sonrakini başlatır)
        required: false
        default: false
        type: boolean
      from_id:
        description: İlk ürün ID'si (boş = baştan)
        required: false
        default: ""
        type: string
      to_id:
        description: Son ürün ID'si, dahil (boş = sona kadar)
        required: false
        default: ""
        type: string
      force:
        description: Aralıktaki değişmemiş ürünleri de yeniden denetle
        required: false
        default: false
        type: boolean
      limit:
        description: Maximum number of products to audit (empty = AUDIT_DAILY_LIMIT)
        required: false
        default: ""
        type: string
      dry_run:
        description: Deneme (veritabanına yazmaz; limit boşsa 20 ürün). Bulgular public loga yazılmaz, sadece sayılar görünür.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Only for an until-done chain: the last step starts the next run of this workflow.
  actions: write

# A run started while another is going waits for it, so chained runs never overlap.
concurrency:
  group: product-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit products with Gemma
    runs-on: ubuntu-latest
    # The audit step below has its own limit derived from AUDIT_MAX_MINUTES; this is GitHub's
    # maximum and only guards the setup steps.
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit products
        id: audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          AUDIT_MODEL: ${{ vars.AUDIT_MODEL || 'gemma-4-31b-it' }}
          AUDIT_FALLBACK_MODEL: ${{ vars.AUDIT_FALLBACK_MODEL || 'gemma-4-26b-a4b-it' }}
          AUDIT_DAILY_LIMIT: ${{ vars.AUDIT_DAILY_LIMIT || '1000' }}
          AUDIT_MAX_MINUTES: ${{ vars.AUDIT_MAX_MINUTES || '90' }}
          AUDIT_KEY_CONCURRENCY: ${{ vars.AUDIT_KEY_CONCURRENCY || '2' }}
          AUDIT_KEY_INTERVAL_MS: ${{ vars.AUDIT_KEY_INTERVAL_MS || '30000' }}
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_FROM_ID: ${{ inputs.from_id }}
          AUDIT_TO_ID: ${{ inputs.to_id }}
          AUDIT_FORCE: ${{ inputs.force && '1' || '' }}
          AUDIT_UNTIL_DONE: ${{ inputs.until_done && '1' || '' }}
          AUDIT_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        # The script stops starting work at AUDIT_MAX_MINUTES (at most 330) and the last request
        # ends within ~6 minutes; the extra 20 minutes only stop a hung process.
        run: |
          minutes="${AUDIT_MAX_MINUTES//[^0-9]/}"
          minutes=$((10#${minutes:-90}))
          if [ "$minutes" -lt 1 ]; then minutes=90; fi
          if [ "$minutes" -gt 330 ]; then minutes=330; fi
          timeout "$((minutes + 20))m" node bin/audit.js \
            ${AUDIT_LIMIT:+--limit "$AUDIT_LIMIT"} \
            ${AUDIT_FROM_ID:+--from-id "$AUDIT_FROM_ID"} ${AUDIT_TO_ID:+--to-id "$AUDIT_TO_ID"} ${AUDIT_FORCE:+--force} \
            ${AUDIT_UNTIL_DONE:+--until-done} ${AUDIT_DRY_RUN:+--dry-run}

      # GITHUB_TOKEN may start workflow_dispatch runs (unlike other events). The new run waits in
      # the concurrency group until this one ends.
      - name: Start the next run
        if: ${{ steps.audit.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_LIMIT: ${{ inputs.limit }}
          AUDIT_FROM_ID: ${{ inputs.from_id }}
          AUDIT_TO_ID: ${{ inputs.to_id }}
          COOLDOWN: ${{ steps.audit.outputs.cooldown }}
        # After a run stopped by repeated Gemini errors, wait before the next one tries again.
        run: |
          if [ "$COOLDOWN" = "true" ]; then sleep 300; fi
          gh workflow run audit.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f until_done=true \
            ${AUDIT_LIMIT:+-f limit="$AUDIT_LIMIT"} ${AUDIT_FROM_ID:+-f from_id="$AUDIT_FROM_ID"} ${AUDIT_TO_ID:+-f to_id="$AUDIT_TO_ID"}

